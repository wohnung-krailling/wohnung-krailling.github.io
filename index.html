<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maisonette-Wohnung in Krailling – Kurz-Exposé</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --text2: #3A3A3C;
      --muted: #8E8E93;
      --sep: rgba(60,60,67,0.12);
      --blue: #007AFF;
      --blue-bg: #EBF3FF;
      --green: #34C759;
      --radius: 20px;
      --shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    html { font-size: 17px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .hero-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.72) 100%);
    }

    .hero-text {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 22px;
      color: #fff;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 6px;
    }

    .hero-text h1 {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    /* ── FACT CHIPS ── */
    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .fact {
      background: var(--card);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: var(--shadow);
      flex: 1 1 calc(50% - 10px);
